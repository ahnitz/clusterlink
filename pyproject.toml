[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-clusterlink"
version = "0.1.0"
description = "User-owned HTCondor SSH cluster enrollment prototype"
requires-python = ">=3.11"
dependencies = ["conda-pack>=0.8", "htcondor>=25,<26"]

[project.scripts]
clusterlink = "clusterlink.cli:main"
ssh_to_job = "clusterlink.cli:ssh_main"

[tool.setuptools]
packages = ["clusterlink"]
